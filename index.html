<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="cxe-logo.png">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据抓取助手 - APP下载</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%); min-height: 100vh; color: #fff; }
    .container { max-width: 500px; margin: 0 auto; padding: 40px 20px; }
    .hero { text-align: center; margin-bottom: 40px; }
    .logo { width: 96px; height: 96px; background: #fff; border-radius: 24px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 30px rgba(0,0,0,0.35); }
    .logo img { width: 80%; height: 80%; object-fit: contain; display: block; }
    h1 { font-size: 28px; margin-bottom: 8px; }
    .subtitle { color: #94a3b8; font-size: 15px; }
    .version-card { background: rgba(255,255,255,0.08); border-radius: 16px; padding: 24px; margin-bottom: 20px; backdrop-filter: blur(10px); }
    .ver-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .ver-label { color: #94a3b8; font-size: 14px; }
    .ver-value { font-weight: bold; font-size: 16px; }
    .tag { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 12px; margin-left: 8px; }
    .tag-new { background: #22c55e; color: #fff; }
    .tag-force { background: #f59e0b; color: #000; }
    .update-note { background: rgba(255,255,255,0.05); border-radius: 10px; padding: 16px; margin-top: 16px; }
    .update-note h3 { font-size: 14px; color: #94a3b8; margin-bottom: 10px; }
    .update-note ul { padding-left: 20px; color: #e2e8f0; line-height: 1.8; font-size: 14px; }
    .download-btn { display: block; width: 100%; padding: 18px; background: linear-gradient(135deg, #ef4444, #f97316); color: white; text-align: center; border-radius: 14px; text-decoration: none; font-size: 18px; font-weight: bold; margin-top: 24px; box-shadow: 0 4px 20px rgba(239,68,68,0.4); }
    .download-btn:active { transform: scale(0.98); }
    .features { margin-top: 40px; }
    .features h3 { text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
    .feat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .feat { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 16px; text-align: center; }
    .feat-icon { font-size: 28px; margin-bottom: 8px; }
    .feat-text { font-size: 13px; color: #cbd5e1; }
    .footer { text-align: center; margin-top: 40px; color: #475569; font-size: 12px; }
    .loading { text-align: center; padding: 60px 0; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="container">
    <div class="hero">
      <div class="logo"><img src="cxe-logo-dark.png" alt="CXe"></div>
      <h1>数据抓取助手</h1>
      <div class="subtitle">AI智能分析 · 每日更新数据爬取</div>
    </div>

    <div id="content"><div class="loading">加载中…</div></div>

    <div style="text-align:center; padding:20px; color:#94a3b8; font-size:14px;">本软件所有功能免费使用，不收取任何费用，感谢大家维护</div>

    <div class="features">
      <h3>主要功能</h3>
      <div class="feat-grid">
        <div class="feat"><div class="feat-icon">📊</div><div class="feat-text">每日AI预测</div></div>
        <div class="feat"><div class="feat-icon">🔢</div><div class="feat-text">全面数据覆盖</div></div>
        <div class="feat"><div class="feat-icon">⚡</div><div class="feat-text">实时更新</div></div>
        <div class="feat"><div class="feat-icon">🔔</div><div class="feat-text">更新提醒</div></div>
      </div>
    </div>

    <div class="footer">仅供学习参考 · 请理性参考</div>
  </div>

<script>
var API = "https://ttqethamvwtmkcqtiwkq.supabase.co/rest/v1/app_versions";
var KEY = "sb_publishable_yGdihfzSeimM08NVH6a8oQ_S7nkOndm";

fetch(API + "?select=*&order=version_code.desc&limit=1", { headers: { "apikey": KEY } })
  .then(r => r.json())
  .then(rows => {
    if (!rows || !rows.length) {
      document.getElementById("content").innerHTML = '<div class="loading">暂未发布版本，敬请期待</div>';
      return;
    }
    var v = rows[0];
    var badges = '<span class="tag tag-new">最新版</span>';
    if (v.force_update) badges += '<span class="tag tag-force">强制更新</span>';
    var notes = "";
    if (v.update_note) {
      var lines = v.update_note.split("\n").filter(l => l.trim());
      notes = '<div class="update-note"><h3>更新内容</h3><ul>' +
        lines.map(l => '<li>' + esc(l.trim()) + '</li>').join("") + '</ul></div>';
    }
    var dl = v.download_url ? '<a class="download-btn" href="' + esc(v.download_url) + '">⬇ 下载 APP (v' + esc(v.version_name) + ')</a>' : '<button class="download-btn" disabled style="opacity:0.5;cursor:not-allowed">⬇ 下载 APP (即将上线)</button>';
    document.getElementById("content").innerHTML =
      '<div class="version-card">' +
        '<div class="ver-row"><span class="ver-label">当前版本</span><span class="ver-value">v' + esc(v.version_name) + badges + '</span></div>' +
        '<div class="ver-row"><span class="ver-label">更新时间</span><span class="ver-value" style="font-size:14px;font-weight:normal">' + (v.created_at||"").substring(0,10) + '</span></div>' +
        notes +
        dl +
      '</div>';
  })
  .catch(e => { document.getElementById("content").innerHTML = '<div class="loading">加载失败，请刷新重试</div>'; });

function esc(s) { var d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; }
</script>
</body>
</html>
